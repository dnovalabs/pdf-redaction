[project]
name = "pdf-redactor"
version = "0.1.0"
description = "True PDF redaction with visual selection and text search"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
]

[project.scripts]
pdf-redactor = "app:main"
