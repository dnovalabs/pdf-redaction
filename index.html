<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Redactor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:             #fafafa;
    --surface-1:      #ffffff;
    --surface-2:      #f4f4f5;
    --surface-3:      #ececed;
    --border:         #e4e4e7;
    --border-strong:  #d4d4d8;
    --text-1:         #18181b;
    --text-2:         #71717a;
    --text-3:         #a1a1aa;
    --accent:         #0d9488;
    --accent-hover:   #0f766e;
    --accent-light:   #f0fdfa;
    --accent-dim:     rgba(13, 148, 136, .1);
    --success:        #16a34a;
    --success-bg:     #f0fdf4;
    --success-border: #bbf7d0;
    --error:          #dc2626;
    --error-bg:       #fef2f2;
    --error-border:   #fecaca;
    --info:           #0284c7;
    --info-bg:        #f0f9ff;
    --info-border:    #bae6fd;
    --shadow-sm:      0 1px 2px rgba(0, 0, 0, .06);
    --shadow-md:      0 2px 8px rgba(0, 0, 0, .08), 0 1px 2px rgba(0, 0, 0, .04);
    --r-sm:           4px;
    --r-md:           6px;
    --r-input:        8px;
    --r-lg:           10px;
    --font-ui:        'Instrument Sans', system-ui, sans-serif;
    --font-mono:      'Geist Mono', 'SF Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text-1);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 0.75rem 2rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface-1);
    display: flex; align-items: center; gap: 0.75rem;
    box-shadow: var(--shadow-sm);
  }
  header h1 { font-size: 1rem; font-weight: 600; color: var(--text-1); }

  header .tag {
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 0.2rem 0.5rem; border-radius: var(--r-sm); font-weight: 600;
    background: var(--error-bg); color: #991b1b; border: 1px solid var(--error-border);
  }

  .drive-badge {
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 0.2rem 0.5rem; border-radius: var(--r-sm); font-weight: 600;
  }
  .drive-badge.connected {
    background: var(--success-bg); color: #15803d; border: 1px solid var(--success-border);
  }
  .drive-badge.disconnected {
    background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem 2rem; }

  /* Upload */
  .upload-zone {
    border: 1.5px dashed var(--border-strong); border-radius: var(--r-lg);
    padding: 3rem 2rem; text-align: center; cursor: pointer;
    background: var(--surface-1);
    transition: border-color 0.15s, background 0.15s;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent); background: var(--accent-light);
  }
  .upload-zone p { color: var(--text-2); margin-top: 0.5rem; font-size: 0.875rem; }
  .upload-zone .icon { font-size: 2rem; }
  .upload-zone input { display: none; }

  /* Customer name row */
  .customer-row {
    display: none; margin-top: 1rem; gap: 0.75rem; align-items: center;
  }
  .customer-row.visible { display: flex; }
  .customer-row label {
    font-size: 0.8rem; color: var(--text-2); white-space: nowrap; font-weight: 500;
  }
  .customer-row input {
    flex: 1; max-width: 360px; padding: 0.45rem 0.75rem;
    border: 1px solid var(--border-strong); border-radius: var(--r-input);
    background: var(--surface-1); color: var(--text-1);
    font-size: 0.8rem; outline: none; font-family: var(--font-ui);
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .customer-row input:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim);
  }
  .customer-row input.error {
    border-color: var(--error); box-shadow: 0 0 0 3px rgba(220, 38, 38, .08);
  }
  .customer-row .filename-preview {
    font-size: 0.73rem; color: var(--text-3); font-family: var(--font-mono);
  }

  /* Toolbar */
  .toolbar {
    display: flex; gap: 0.5rem; align-items: center;
    margin-top: 0.75rem; flex-wrap: wrap;
  }

  .mode-tabs {
    display: flex; border-radius: var(--r-md); overflow: hidden;
    border: 1px solid var(--border-strong); box-shadow: var(--shadow-sm);
  }
  .mode-tabs button {
    padding: 0.45rem 1rem; border: none; border-radius: 0;
    background: var(--surface-1); color: var(--text-2);
    font-size: 0.75rem; font-weight: 500; cursor: pointer;
    font-family: var(--font-ui);
    transition: background 0.12s, color 0.12s, transform 0.1s ease-out;
  }
  .mode-tabs button:not(.active):hover { background: var(--surface-3); color: var(--text-1); }
  .mode-tabs button.active { background: var(--accent); color: #fff; }
  .mode-tabs button + button { border-left: 1px solid var(--border); }

  .search-group { display: flex; gap: 0.5rem; flex: 1; min-width: 200px; }
  .search-group input {
    flex: 1; padding: 0.45rem 0.75rem;
    border: 1px solid var(--border-strong); border-radius: var(--r-input);
    background: var(--surface-1); color: var(--text-1);
    font-size: 0.8rem; outline: none; font-family: var(--font-ui);
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search-group input:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim);
  }

  button {
    padding: 0.45rem 1rem; border: none; border-radius: var(--r-md);
    font-size: 0.75rem; font-weight: 500; cursor: pointer;
    font-family: var(--font-ui);
    transition: background 0.12s, box-shadow 0.12s, transform 0.1s ease-out, color 0.12s;
  }
  button:active:not(:disabled) { transform: scale(0.97); }
  .btn-search {
    background: var(--accent); color: #fff;
    box-shadow: 0 1px 2px rgba(13, 148, 136, .2);
  }
  .btn-search:hover { background: var(--accent-hover); box-shadow: 0 3px 10px rgba(13, 148, 136, .25); }

  .btn-preview {
    background: var(--accent); color: #fff;
    box-shadow: 0 1px 2px rgba(13, 148, 136, .2);
  }
  .btn-preview:hover { background: var(--accent-hover); box-shadow: 0 3px 10px rgba(13, 148, 136, .25); }

  .btn-send {
    background: var(--accent); color: #fff;
    box-shadow: 0 1px 2px rgba(13, 148, 136, .2);
  }
  .btn-send:hover { background: var(--accent-hover); box-shadow: 0 3px 10px rgba(13, 148, 136, .25); }

  .btn-download {
    background: var(--surface-1); color: var(--text-1);
    border: 1px solid var(--border-strong); box-shadow: var(--shadow-sm);
  }
  .btn-download:hover { background: var(--surface-2); box-shadow: 0 2px 6px rgba(0,0,0,.08); }

  .btn-cancel {
    background: transparent; color: var(--text-2); border: 1px solid var(--border);
  }
  .btn-cancel:hover { background: var(--surface-2); color: var(--text-1); }

  .btn-clear {
    background: transparent; color: var(--text-2); border: 1px solid var(--border);
  }
  .btn-clear:hover { background: var(--surface-2); color: var(--text-1); }

  button:disabled { opacity: 0.4 !important; cursor: not-allowed; }

  .spacer { flex: 1; }
  .info { font-size: 0.73rem; color: var(--accent); font-family: var(--font-mono); }

  /* Page nav */
  .page-nav {
    display: flex; align-items: center; justify-content: center;
    gap: 1rem; margin-top: 0.75rem;
  }
  .page-nav button {
    background: var(--surface-1); color: var(--text-2);
    padding: 0.3rem 0.7rem; border-radius: var(--r-sm);
    border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  }
  .page-nav button:hover { background: var(--surface-2); }
  .page-nav span { font-size: 0.73rem; color: var(--text-3); font-family: var(--font-mono); }

  /* Preview with canvas */
  .preview-wrap {
    position: relative; display: inline-block; margin-top: 0.75rem; max-width: 100%;
  }
  .preview-wrap img {
    display: block; max-width: 100%; border-radius: var(--r-md);
    border: 1px solid var(--border); box-shadow: var(--shadow-md);
    user-select: none; -webkit-user-drag: none;
  }
  .preview-wrap canvas {
    position: absolute; top: 0; left: 0; border-radius: var(--r-md); cursor: crosshair;
  }
  .preview-center { text-align: center; margin-top: 0.75rem; }

  .status {
    margin-top: 0.75rem; padding: 0.55rem 1rem; border-radius: var(--r-md);
    font-size: 0.75rem; display: none; border: 1px solid;
  }
  .status.success {
    display: block;
    background: var(--success-bg); color: var(--success); border-color: var(--success-border);
  }
  .status.error {
    display: block;
    background: var(--error-bg); color: var(--error); border-color: var(--error-border);
  }
  .status.info {
    display: block;
    background: var(--info-bg); color: var(--info); border-color: var(--info-border);
  }

  .file-info {
    margin-top: 0.75rem; font-size: 0.75rem; color: var(--text-2);
    display: flex; align-items: center; gap: 0.5rem;
  }
  .file-info .name { color: var(--text-1); font-weight: 500; }

  .help-text {
    margin-top: 0.5rem; font-size: 0.73rem; color: var(--text-3); font-style: italic;
  }

  /* Preview banner */
  .preview-banner {
    display: none; margin-top: 1rem; padding: 0.6rem 1rem;
    background: var(--info-bg); border: 1px solid var(--info-border);
    border-radius: var(--r-md); font-size: 0.8rem; color: var(--info);
    align-items: center; gap: 0.75rem; flex-wrap: wrap;
    position: relative; overflow: hidden;
  }
  .preview-banner.visible { display: flex; }
  .preview-banner .label { flex: 1; min-width: 200px; }

  /* Send progress bar */
  .send-progress {
    position: absolute; bottom: 0; left: 0; height: 3px; width: 0%;
    background: var(--accent); border-radius: 0 0 var(--r-md) var(--r-md);
    opacity: 0; pointer-events: none;
  }
  .send-progress.active { opacity: 1; }

  /* Login overlay */
  .login-overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 100;
    display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 2rem; width: 360px; max-width: 90vw;
    box-shadow: var(--shadow-md);
  }
  .login-card h2 {
    font-size: 1rem; font-weight: 600; color: var(--text-1); margin-bottom: 0.25rem;
  }
  .login-card p { font-size: 0.8rem; color: var(--text-2); margin-bottom: 1.5rem; }
  .login-field { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1rem; }
  .login-field label { font-size: 0.73rem; font-weight: 500; color: var(--text-2); }
  .login-field input {
    padding: 0.55rem 0.75rem; border: 1px solid var(--border-strong);
    border-radius: var(--r-input); background: var(--surface-1); color: var(--text-1);
    font-size: 0.85rem; outline: none; font-family: var(--font-ui);
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .login-field input:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim);
  }
  .btn-signin {
    width: 100%; padding: 0.6rem; background: var(--accent); color: #fff;
    border: none; border-radius: var(--r-md); font-family: var(--font-ui);
    font-size: 0.85rem; font-weight: 500; cursor: pointer; margin-top: 0.25rem;
    box-shadow: 0 1px 2px rgba(13, 148, 136, .25);
    transition: background 0.12s, box-shadow 0.12s, transform 0.1s ease-out;
  }
  .btn-signin:hover { background: var(--accent-hover); box-shadow: 0 3px 10px rgba(13, 148, 136, .25); }
  .btn-signin:active:not(:disabled) { transform: scale(0.98); }
  .btn-signin:disabled { opacity: 0.4; cursor: not-allowed; }
  .login-error {
    margin-bottom: 0.75rem; padding: 0.45rem 0.75rem; border-radius: var(--r-sm);
    background: var(--error-bg); color: var(--error); border: 1px solid var(--error-border);
    font-size: 0.75rem; display: none;
  }

  /* User info in header */
  .user-info { display: flex; align-items: center; gap: 0.6rem; margin-left: auto; }
  .user-info span { font-size: 0.73rem; color: var(--text-2); }
  .btn-signout {
    padding: 0.3rem 0.6rem; background: transparent; color: var(--text-3);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    font-size: 0.7rem; font-family: var(--font-ui); cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .btn-signout:hover { background: var(--surface-2); color: var(--text-1); }

  /* Toast notification */
  .toast {
    position: fixed; top: 1rem; right: 1rem; z-index: 200;
    background: var(--success-bg); border: 1px solid var(--success-border);
    color: var(--success); padding: 0.75rem 1rem;
    border-radius: var(--r-lg); box-shadow: var(--shadow-md);
    font-size: 0.8rem; max-width: 400px;
    display: flex; align-items: flex-start; gap: 0.6rem;
    opacity: 0; transform: translateY(-8px);
    transition: opacity 0.2s ease-out, transform 0.2s ease-out;
    pointer-events: none;
  }
  .toast.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .toast-body { flex: 1; line-height: 1.5; }
  .toast-body a { color: #15803d; font-weight: 500; }
  .toast-close {
    background: none; border: none; cursor: pointer; color: var(--success);
    padding: 0; font-size: 0.85rem; line-height: 1; opacity: 0.55;
    flex-shrink: 0; margin-top: 1px;
  }
  .toast-close:hover { opacity: 1; }
  .toast-close:active { transform: none; }
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2>PDF Redactor</h2>
    <p>Sign in to continue</p>
    <form id="loginForm" autocomplete="on">
      <div class="login-field">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <div class="login-error" id="loginError"></div>
      <button type="submit" class="btn-signin" id="signinBtn">Sign in</button>
    </form>
  </div>
</div>

<header>
  <h1>PDF Redactor</h1>
  <span class="tag">True Redaction</span>
  <span class="drive-badge disconnected" id="driveBadge" style="display:none">Drive</span>
  <div class="user-info" id="userInfo" style="display:none">
    <span id="usernameDisplay"></span>
    <button class="btn-signout" id="logoutBtn">Sign out</button>
  </div>
</header>

<div class="container">

  <div class="upload-zone" id="dropZone">
    <div class="icon">📄</div>
    <p>Drop a PDF here or click to upload</p>
    <input type="file" id="fileInput" accept=".pdf">
  </div>

  <div class="file-info" id="fileInfo" style="display:none">
    <span>Loaded:</span>
    <span class="name" id="fileName"></span>
    <span id="pageCount"></span>
  </div>

  <!-- Customer name -->
  <div class="customer-row" id="customerRow">
    <label for="customerName">Customer name</label>
    <input type="text" id="customerName" placeholder="Required — used as the output filename">
    <span class="filename-preview" id="filenamePreview"></span>
  </div>

  <!-- Edit toolbar -->
  <div class="toolbar" id="editToolbar" style="display:none">
    <div class="mode-tabs">
      <button class="active" data-mode="draw" id="modeDrawBtn">Draw</button>
      <button data-mode="text" id="modeTextBtn">Text Search</button>
    </div>
    <div class="search-group" id="searchGroup" style="display:none">
      <input type="text" id="searchInput" placeholder="Search text…">
      <button class="btn-search" id="searchBtn">Find</button>
    </div>
    <span class="info" id="matchInfo"></span>
    <span class="spacer"></span>
    <button class="btn-clear" id="clearBtn" disabled>Clear</button>
    <button class="btn-preview" id="previewBtn" disabled>Preview Redaction</button>
  </div>

  <!-- Preview confirmation banner -->
  <div class="preview-banner" id="previewBanner">
    <span class="label">Previewing redacted result — check each page before confirming.</span>
    <button class="btn-send" id="sendBtn" style="display:none">Send to Drive</button>
    <button class="btn-download" id="downloadBtn">Download</button>
    <button class="btn-cancel" id="cancelBtn">Cancel</button>
    <div class="send-progress" id="sendProgress"></div>
  </div>

  <p class="help-text" id="helpText" style="display:none">
    Click and drag on the page to mark areas for redaction.
  </p>

  <div class="page-nav" id="pageNav" style="display:none">
    <button id="prevBtn">← Prev</button>
    <span id="pageLabel">Page 1 / 1</span>
    <button id="nextBtn">Next →</button>
  </div>

  <div class="preview-center" id="previewCenter">
    <div class="preview-wrap" id="previewWrap" style="display:none">
      <img id="previewImg" alt="Page preview">
      <canvas id="overlay"></canvas>
    </div>
  </div>

  <div class="status" id="status"></div>
</div>

<div class="toast" id="toast">
  <span class="toast-body" id="toastMsg"></span>
  <button class="toast-close" id="toastClose" aria-label="Dismiss">✕</button>
</div>

<script>
const $ = s => document.querySelector(s);

let sessionId = null;
let pageCount = 0;
let currentPage = 0;
let mode = "draw";
let currentQuery = "";
let drawnRects = {};
let drawing = false;
let startX = 0, startY = 0;
let isPreviewing = false;

// Storage config from server
let storageConfig = { storage_type: "none", credentials_ok: false, file_naming_pattern: "{customer_name}.pdf" };

const img = $("#previewImg");
const canvas = $("#overlay");
const ctx = canvas.getContext("2d");

// ── Auth ─────────────────────────────────────────────────────────────────

async function checkAuth() {
  try {
    const res = await fetch("/me");
    if (res.ok) {
      const data = await res.json();
      $("#usernameDisplay").textContent = data.username;
      $("#userInfo").style.display = "flex";
      $("#loginOverlay").style.display = "none";
      checkConfig();
    } else {
      $("#loginOverlay").style.display = "flex";
    }
  } catch (_) {
    $("#loginOverlay").style.display = "flex";
  }
}

$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const username = $("#loginUsername").value.trim();
  const password = $("#loginPassword").value;
  const errEl = $("#loginError");
  const btn = $("#signinBtn");

  errEl.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Signing in…";

  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      const err = await res.json();
      errEl.textContent = err.detail || "Login failed";
      errEl.style.display = "block";
    } else {
      const data = await res.json();
      $("#usernameDisplay").textContent = data.username;
      $("#userInfo").style.display = "flex";
      $("#loginOverlay").style.display = "none";
      checkConfig();
    }
  } catch (_) {
    errEl.textContent = "Network error. Please try again.";
    errEl.style.display = "block";
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign in";
  }
});

$("#logoutBtn").addEventListener("click", async () => {
  try { await fetch("/logout", { method: "POST" }); } catch (_) {}
  sessionId = null;
  pageCount = 0;
  $("#userInfo").style.display = "none";
  $("#fileInfo").style.display = "none";
  $("#customerRow").classList.remove("visible");
  $("#editToolbar").style.display = "none";
  $("#previewWrap").style.display = "none";
  $("#pageNav").style.display = "none";
  $("#previewBanner").classList.remove("visible");
  $("#helpText").style.display = "none";
  hideStatus();
  $("#loginOverlay").style.display = "flex";
  $("#loginPassword").value = "";
  $("#loginError").style.display = "none";
});

// ── Config check (called after auth) ─────────────────────────────────────

async function checkConfig() {
  try {
    const res = await fetch("/config-status");
    storageConfig = await res.json();

    const badge = $("#driveBadge");
    if (storageConfig.storage_type === "google_drive") {
      badge.style.display = "";
      if (storageConfig.credentials_ok) {
        badge.className = "drive-badge connected";
        badge.textContent = "Drive ✓";
      } else {
        badge.className = "drive-badge disconnected";
        badge.textContent = "Drive ✗";
      }
    }
  } catch (_) {}
}

checkAuth();

// ── Customer name → filename preview ────────────────────────────────────

$("#customerName").addEventListener("input", () => {
  const name = $("#customerName").value.trim();
  $("#customerName").classList.toggle("error", false);
  if (name) {
    const fname = storageConfig.file_naming_pattern.replace("{customer_name}", name);
    $("#filenamePreview").textContent = `→ ${fname}`;
  } else {
    $("#filenamePreview").textContent = "";
  }
});

// ── Upload ──────────────────────────────────────────────────────────────

const dropZone = $("#dropZone");
const fileInput = $("#fileInput");

dropZone.addEventListener("click", () => fileInput.click());
dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", e => {
  e.preventDefault(); dropZone.classList.remove("dragover");
  if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => { if (fileInput.files.length) uploadFile(fileInput.files[0]); });

async function uploadFile(file) {
  const form = new FormData();
  form.append("file", file);
  try {
    const res = await fetch("/upload", { method: "POST", body: form });
    if (!res.ok) throw new Error((await res.json()).detail);
    const data = await res.json();

    sessionId = data.session_id;
    pageCount = data.page_count;
    currentPage = 0;
    currentQuery = "";
    drawnRects = {};
    isPreviewing = false;

    $("#fileName").textContent = data.filename;
    $("#pageCount").textContent = `· ${pageCount} page${pageCount > 1 ? "s" : ""}`;
    $("#fileInfo").style.display = "flex";
    $("#customerRow").classList.add("visible");
    $("#editToolbar").style.display = "flex";
    $("#helpText").style.display = "block";
    $("#pageNav").style.display = "flex";
    $("#previewWrap").style.display = "inline-block";
    $("#previewBanner").classList.remove("visible");

    resetControls();
    hideStatus();
    loadPage();
  } catch (err) { showStatus(err.message, "error"); }
}

// ── Mode switching ──────────────────────────────────────────────────────

$("#modeDrawBtn").addEventListener("click", () => setMode("draw"));
$("#modeTextBtn").addEventListener("click", () => setMode("text"));

function setMode(m) {
  mode = m;
  document.querySelectorAll(".mode-tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.mode === m));
  $("#searchGroup").style.display = m === "text" ? "flex" : "none";
  $("#helpText").textContent = m === "draw"
    ? "Click and drag on the page to mark areas for redaction."
    : "Search for text to highlight matches, then preview redaction.";
  canvas.style.pointerEvents = m === "draw" ? "auto" : "none";
  if (m === "text") { currentQuery = ""; loadPage(); }
  updateButtons();
}

// ── Page navigation ─────────────────────────────────────────────────────

$("#prevBtn").addEventListener("click", () => { if (currentPage > 0) { currentPage--; loadPage(); } });
$("#nextBtn").addEventListener("click", () => { if (currentPage < pageCount - 1) { currentPage++; loadPage(); } });

function loadPage() {
  let url = `/preview/${sessionId}/${currentPage}?dpi=150&t=${Date.now()}`;
  if (isPreviewing) {
    url += "&pending=true";
  } else if (mode === "text" && currentQuery) {
    url += `&search=${encodeURIComponent(currentQuery)}`;
  }
  img.src = url;
  $("#pageLabel").textContent = `Page ${currentPage + 1} / ${pageCount}`;
  $("#prevBtn").disabled = currentPage === 0;
  $("#nextBtn").disabled = currentPage >= pageCount - 1;
}

img.addEventListener("load", () => {
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  canvas.style.width = img.clientWidth + "px";
  canvas.style.height = img.clientHeight + "px";
  drawOverlay();
});

window.addEventListener("resize", () => {
  canvas.style.width = img.clientWidth + "px";
  canvas.style.height = img.clientHeight + "px";
});

// ── Drawing ─────────────────────────────────────────────────────────────

function canvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height),
  };
}

canvas.addEventListener("mousedown", e => {
  if (mode !== "draw" || isPreviewing) return;
  drawing = true;
  const p = canvasCoords(e);
  startX = p.x; startY = p.y;
});

canvas.addEventListener("mousemove", e => {
  if (!drawing) return;
  const p = canvasCoords(e);
  drawOverlay();
  const rx = Math.min(startX, p.x), ry = Math.min(startY, p.y);
  const rw = Math.abs(p.x - startX), rh = Math.abs(p.y - startY);
  ctx.fillStyle = "rgba(13, 148, 136, 0.1)";
  ctx.strokeStyle = "#0d9488";
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 3]);
  ctx.fillRect(rx, ry, rw, rh);
  ctx.strokeRect(rx, ry, rw, rh);
  ctx.setLineDash([]);
});

canvas.addEventListener("mouseup", e => {
  if (!drawing) return;
  drawing = false;
  const p = canvasCoords(e);
  const rx = Math.min(startX, p.x), ry = Math.min(startY, p.y);
  const rw = Math.abs(p.x - startX), rh = Math.abs(p.y - startY);
  if (rw < 5 || rh < 5) return;

  if (!drawnRects[currentPage]) drawnRects[currentPage] = [];
  drawnRects[currentPage].push({
    x: rx / canvas.width, y: ry / canvas.height,
    w: rw / canvas.width, h: rh / canvas.height,
  });
  drawOverlay();
  updateButtons();
});

canvas.addEventListener("mouseleave", () => { if (drawing) { drawing = false; drawOverlay(); } });

function drawOverlay() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (isPreviewing) return;

  const rects = drawnRects[currentPage] || [];
  for (const r of rects) {
    const px = r.x * canvas.width, py = r.y * canvas.height;
    const pw = r.w * canvas.width, ph = r.h * canvas.height;
    ctx.fillStyle = "rgba(13, 148, 136, 0.1)";
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = "#0d9488";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 3]);
    ctx.strokeRect(px, py, pw, ph);
    ctx.setLineDash([]);

    const bx = px + pw - 18, by = py + 4, bs = 14;
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(bx, by, bs, bs);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(bx + 3, by + 3); ctx.lineTo(bx + bs - 3, by + bs - 3);
    ctx.moveTo(bx + bs - 3, by + 3); ctx.lineTo(bx + 3, by + bs - 3);
    ctx.stroke();
  }
}

canvas.addEventListener("click", e => {
  if (mode !== "draw" || drawing || isPreviewing) return;
  const p = canvasCoords(e);
  const rects = drawnRects[currentPage] || [];
  for (let i = rects.length - 1; i >= 0; i--) {
    const r = rects[i];
    const px = r.x * canvas.width, pw = r.w * canvas.width;
    const py = r.y * canvas.height;
    const bx = px + pw - 18, by = py + 4, bs = 14;
    if (p.x >= bx && p.x <= bx + bs && p.y >= by && p.y <= by + bs) {
      rects.splice(i, 1);
      drawOverlay();
      updateButtons();
      return;
    }
  }
});

// ── Text search ─────────────────────────────────────────────────────────

$("#searchBtn").addEventListener("click", doSearch);
$("#searchInput").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

async function doSearch() {
  const q = $("#searchInput").value.trim();
  if (!q || !sessionId) return;
  currentQuery = q;
  try {
    const res = await fetch(`/search/${sessionId}?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    if (data.total > 0) {
      $("#matchInfo").textContent = `${data.total} match${data.total > 1 ? "es" : ""} on ${data.matches.length} page${data.matches.length > 1 ? "s" : ""}`;
      currentPage = data.matches[0].page;
    } else {
      $("#matchInfo").textContent = "No matches";
    }
    updateButtons();
    loadPage();
  } catch (err) { showStatus(err.message, "error"); }
}

// ── Preview / Send / Download / Cancel ──────────────────────────────────

$("#previewBtn").addEventListener("click", preparePreview);
$("#sendBtn").addEventListener("click", () => confirmAction("send"));
$("#downloadBtn").addEventListener("click", () => confirmAction("download"));
$("#cancelBtn").addEventListener("click", cancelPreview);
$("#clearBtn").addEventListener("click", () => {
  drawnRects = {};
  currentQuery = "";
  $("#searchInput").value = "";
  $("#matchInfo").textContent = "";
  updateButtons();
  loadPage();
});

function getCustomerName() {
  const name = $("#customerName").value.trim();
  if (!name) {
    $("#customerName").classList.add("error");
    $("#customerName").focus();
    showStatus("Customer name is required.", "error");
    return null;
  }
  return name;
}

async function preparePreview() {
  const customerName = getCustomerName();
  if (!customerName) return;

  const allRects = [];
  for (const [page, rects] of Object.entries(drawnRects)) {
    for (const r of rects) allRects.push({ page: parseInt(page), ...r });
  }
  const textQ = (mode === "text") ? currentQuery : "";
  if (allRects.length === 0 && !textQ) return;

  try {
    const res = await fetch(`/prepare-redaction/${sessionId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rects: allRects, text_query: textQ }),
    });
    if (!res.ok) throw new Error((await res.json()).detail);
    const data = await res.json();

    isPreviewing = true;
    showStatus(`Preview: ${data.count} area${data.count > 1 ? "s" : ""} redacted. Browse pages to verify, then send or download.`, "info");

    $("#editToolbar").style.display = "none";
    $("#helpText").style.display = "none";
    $("#previewBanner").classList.add("visible");
    canvas.style.pointerEvents = "none";

    // Show/hide Send to Drive based on config
    const driveAvailable = storageConfig.storage_type === "google_drive" && storageConfig.credentials_ok;
    $("#sendBtn").style.display = driveAvailable ? "" : "none";

    currentPage = 0;
    loadPage();
  } catch (err) { showStatus(err.message, "error"); }
}

async function confirmAction(action) {
  const customerName = getCustomerName();
  if (!customerName) return;

  const endpoint = action === "send" ? "confirm-send" : "confirm-download";

  const sendBtn = $("#sendBtn");
  const downloadBtn = $("#downloadBtn");
  const cancelBtn = $("#cancelBtn");

  if (action === "send") {
    startSendProgress();
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    downloadBtn.disabled = true;
    cancelBtn.disabled = true;
  }

  try {
    const res = await fetch(`/${endpoint}/${sessionId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ customer_name: customerName }),
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || res.statusText);
    }

    if (action === "send") {
      const data = await res.json();
      completeSendProgress();
      resetToInitial();
      const link = data.web_link
        ? `Sent to Google Drive: <a href="${data.web_link}" target="_blank">${data.file_name}</a>`
        : `Sent to Google Drive as ${data.file_name}`;
      showToast(link);
    } else {
      const blob = await res.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = res.headers.get("Content-Disposition")?.match(/filename="(.+)"/)?.[1] || "redacted.pdf";
      a.click();
      URL.revokeObjectURL(a.href);
      resetToInitial();
      showToast("File downloaded successfully.");
    }
  } catch (err) {
    if (action === "send") {
      resetSendProgress();
      sendBtn.disabled = false;
      sendBtn.textContent = "Send to Drive";
      downloadBtn.disabled = false;
      cancelBtn.disabled = false;
    }
    showStatus(err.message, "error");
  }
}

async function cancelPreview() {
  try { await fetch(`/cancel-redaction/${sessionId}`, { method: "POST" }); } catch (_) {}
  exitPreviewMode();
  showStatus("Preview cancelled. Your selections are still in place.", "info");
}

function exitPreviewMode() {
  isPreviewing = false;
  drawnRects = {};
  currentQuery = "";
  $("#searchInput").value = "";
  $("#matchInfo").textContent = "";
  $("#editToolbar").style.display = "flex";
  $("#helpText").style.display = "block";
  $("#previewBanner").classList.remove("visible");
  canvas.style.pointerEvents = mode === "draw" ? "auto" : "none";
  updateButtons();
  loadPage();
}

// ── Helpers ──────────────────────────────────────────────────────────────

function resetControls() {
  setMode("draw");
  $("#matchInfo").textContent = "";
  $("#searchInput").value = "";
  $("#customerName").value = "";
  $("#filenamePreview").textContent = "";
}

function updateButtons() {
  const hasDrawn = Object.values(drawnRects).some(a => a.length > 0);
  const hasText = mode === "text" && currentQuery && ($("#matchInfo").textContent || "").includes("match");
  $("#previewBtn").disabled = !hasDrawn && !hasText;
  $("#clearBtn").disabled = !hasDrawn && !currentQuery;

  const totalRects = Object.values(drawnRects).reduce((s, a) => s + a.length, 0);
  if (mode === "draw" && totalRects > 0) {
    $("#matchInfo").textContent = `${totalRects} area${totalRects > 1 ? "s" : ""} selected`;
  }
}

function showStatus(msg, type) {
  const el = $("#status"); el.textContent = msg; el.className = `status ${type}`;
}
function showStatusHTML(html, type) {
  const el = $("#status"); el.innerHTML = html; el.className = `status ${type}`;
}
function hideStatus() { $("#status").className = "status"; }

// ── Send progress bar ────────────────────────────────────────────────────

let sendProgressTimer = null;

function startSendProgress() {
  clearTimeout(sendProgressTimer);
  const bar = $("#sendProgress");
  bar.style.transition = "none";
  bar.style.width = "0%";
  bar.classList.add("active");

  // Staged simulation: fast early, slow near the end while waiting on server
  const steps = [
    { target: 28, ms: 350 },
    { target: 50, ms: 500 },
    { target: 66, ms: 700 },
    { target: 78, ms: 1000 },
    { target: 88, ms: 1600 },
    { target: 93, ms: 2500 },
  ];
  let i = 0;
  function advance() {
    if (i >= steps.length) return;
    const s = steps[i++];
    bar.style.transition = `width ${s.ms}ms ease-out`;
    bar.style.width = s.target + "%";
    sendProgressTimer = setTimeout(advance, s.ms);
  }
  requestAnimationFrame(advance);
}

function completeSendProgress() {
  clearTimeout(sendProgressTimer);
  const bar = $("#sendProgress");
  bar.style.transition = "width 0.2s ease-out";
  bar.style.width = "100%";
  setTimeout(() => {
    bar.style.transition = "opacity 0.3s ease-in";
    bar.style.opacity = "0";
    setTimeout(() => { bar.classList.remove("active"); bar.style.cssText = ""; }, 320);
  }, 220);
}

function resetSendProgress() {
  clearTimeout(sendProgressTimer);
  const bar = $("#sendProgress");
  bar.style.transition = "opacity 0.2s ease-in";
  bar.style.opacity = "0";
  setTimeout(() => { bar.classList.remove("active"); bar.style.cssText = ""; }, 220);
}

// ── Toast ────────────────────────────────────────────────────────────────

let toastTimer = null;

function showToast(html, duration = 7000) {
  const toast = $("#toast");
  $("#toastMsg").innerHTML = html;
  toast.classList.add("visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("visible"), duration);
}

$("#toastClose").addEventListener("click", () => {
  clearTimeout(toastTimer);
  $("#toast").classList.remove("visible");
});

// ── Reset to upload state ─────────────────────────────────────────────────

function resetToInitial() {
  sessionId = null;
  pageCount = 0;
  currentPage = 0;
  isPreviewing = false;
  drawnRects = {};
  currentQuery = "";

  resetSendProgress();
  const sendBtn = $("#sendBtn");
  sendBtn.disabled = false;
  sendBtn.textContent = "Send to Drive";
  $("#downloadBtn").disabled = false;
  $("#cancelBtn").disabled = false;

  $("#fileInfo").style.display = "none";
  $("#customerRow").classList.remove("visible");
  $("#editToolbar").style.display = "none";
  $("#previewWrap").style.display = "none";
  $("#pageNav").style.display = "none";
  $("#previewBanner").classList.remove("visible");
  $("#helpText").style.display = "none";
  hideStatus();

  $("#customerName").value = "";
  $("#filenamePreview").textContent = "";
  $("#searchInput").value = "";
  $("#matchInfo").textContent = "";
  fileInput.value = "";

  setMode("draw");
}
</script>
